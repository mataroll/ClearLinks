<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearLinks Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #4a90d9;
        }

        .result-box {
            margin-top: 30px;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .result-box.safe {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
        }

        .result-box.warning {
            background: linear-gradient(135deg, #fff3cd 0%, #ffeeba 100%);
            border: 2px solid #ffc107;
        }

        .result-box.danger {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border: 2px solid #dc3545;
        }

        .result-box.neutral {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
        }

        .percentage {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .safe .percentage { color: #155724; }
        .warning .percentage { color: #856404; }
        .danger .percentage { color: #721c24; }
        .neutral .percentage { color: #6c757d; }

        .status {
            font-size: 18px;
            font-weight: 500;
        }

        .safe .status { color: #155724; }
        .warning .status { color: #856404; }
        .danger .status { color: #721c24; }
        .neutral .status { color: #6c757d; }

        .info {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
        }

        .link-detected {
            margin-top: 15px;
            padding: 10px 16px;
            background: #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            color: #495057;
        }

        .link-detected strong {
            color: #1a1a2e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ClearLinks Checker</h1>
        <p class="subtitle">Paste a message below to check if it contains suspicious links</p>

        <textarea id="messageInput" placeholder="Type or paste a message here..."></textarea>

        <div class="result-box neutral" id="resultBox">
            <div class="percentage" id="percentage">--%</div>
            <div class="status" id="status">Enter a message to analyze</div>
        </div>

        <div class="link-detected" id="linkInfo">
            <strong>Link detected:</strong> <span id="linkStatus">No</span>
        </div>

        <div class="info">
            This tool checks if a message contains URLs (http://, https://, www.) and estimates the probability of it being a suspicious/phishing link based on the trained model.
        </div>
    </div>

    <script>
        // Model weights from your trained model.joblib
        const MODEL_COEF = 10.350651571197552;
        const MODEL_INTERCEPT = -7.135238795853014;

        // Check if text contains a clear link (same logic as Python)
        function hasClearLink(text) {
            if (typeof text !== 'string') return 0;
            const t = text.toLowerCase();
            return (t.includes('http://') || t.includes('https://') || t.includes('www.')) ? 1 : 0;
        }

        // Sigmoid function (same as sklearn's logistic regression)
        function sigmoid(z) {
            return 1 / (1 + Math.exp(-z));
        }

        // Predict probability using actual model weights
        function predictProbability(text) {
            const hasLink = hasClearLink(text);
            // Linear combination: z = coef * feature + intercept
            const z = MODEL_COEF * hasLink + MODEL_INTERCEPT;
            // Apply sigmoid to get probability
            return sigmoid(z);
        }

        function updateResult() {
            const text = document.getElementById('messageInput').value;
            const resultBox = document.getElementById('resultBox');
            const percentageEl = document.getElementById('percentage');
            const statusEl = document.getElementById('status');
            const linkStatusEl = document.getElementById('linkStatus');

            if (!text.trim()) {
                resultBox.className = 'result-box neutral';
                percentageEl.textContent = '--%';
                statusEl.textContent = 'Enter a message to analyze';
                linkStatusEl.textContent = 'No';
                return;
            }

            const hasLink = hasClearLink(text);
            const probability = predictProbability(text);
            const percent = (probability * 100).toFixed(1);

            percentageEl.textContent = percent + '%';
            linkStatusEl.textContent = hasLink ? 'Yes' : 'No';

            if (probability < 0.3) {
                resultBox.className = 'result-box safe';
                statusEl.textContent = 'Likely Clear';
            } else if (probability < 0.7) {
                resultBox.className = 'result-box warning';
                statusEl.textContent = 'Uncertain - Review Carefully';
            } else {
                resultBox.className = 'result-box danger';
                statusEl.textContent = 'Suspicious Link Detected';
            }
        }

        // Live update as user types
        document.getElementById('messageInput').addEventListener('input', updateResult);
    </script>
</body>
</html>
